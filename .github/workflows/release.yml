name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Build Artifacts
      run: |
        chmod +x .github/scripts/build.sh
        ./.github/scripts/build.sh

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          stackboost-for-supportcandy.zip
          stackboost-for-supportcandy-premium.zip

    - name: Push Free Plugin to SBSC Repo
      run: |
        # Setup git configuration
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Clone the destination repository
        git clone https://x-access-token:${{ secrets.PAT }}@github.com/StackBoost-Innovations/SBSC.git destination_repo

        # Clear existing files in the destination repository (excluding .git)
        cd destination_repo
        find . -maxdepth 1 ! -name '.' ! -name '.git' -exec rm -rf {} +

        # Copy the newly built free plugin files
        cp -a ../build/repo/stackboost-for-supportcandy/. .

        # Commit and push changes
        git add .
        if git diff-index --quiet HEAD; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update free plugin from release ${{ github.ref_name }}"
          git push origin main
        fi
